<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBB Market vs Model</title>
    <style>
        /* ------------------------------------------------------------------ */
        /* Reset & base                                                       */
        /* ------------------------------------------------------------------ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            line-height: 1.4;
        }

        /* ------------------------------------------------------------------ */
        /* Header                                                             */
        /* ------------------------------------------------------------------ */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: .3px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .btn {
            background: rgba(255,255,255,.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,.25);
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 500;
            transition: background .2s;
        }
        .btn:hover { background: rgba(255,255,255,.25); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .auto-refresh-label {
            font-size: .8rem;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: .85;
        }
        .auto-refresh-label input { accent-color: #e94560; }

        /* ------------------------------------------------------------------ */
        /* Stats bar                                                          */
        /* ------------------------------------------------------------------ */
        .stats-bar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 28px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            font-size: .82rem;
            color: #555;
        }
        .stat-item { display: flex; align-items: center; gap: 5px; }
        .stat-item .stat-val {
            font-weight: 700;
            color: #1a1a2e;
        }
        .updated-at {
            margin-left: auto;
            font-style: italic;
            color: #888;
        }

        /* ------------------------------------------------------------------ */
        /* Tabs                                                               */
        /* ------------------------------------------------------------------ */
        .tab-bar {
            display: flex;
            background: #fff;
            border-bottom: 2px solid #e0e0e0;
            padding: 0 28px;
        }
        .tab-btn {
            padding: 12px 28px;
            border: none;
            background: none;
            font-size: .95rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color .2s, border-color .2s;
        }
        .tab-btn:hover { color: #1a1a2e; }
        .tab-btn.active {
            color: #e94560;
            border-bottom-color: #e94560;
        }

        /* ------------------------------------------------------------------ */
        /* Table container                                                    */
        /* ------------------------------------------------------------------ */
        .table-wrapper {
            padding: 20px 28px;
            overflow-x: auto;
        }
        .table-wrapper[hidden] { display: none; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .82rem;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        thead th {
            background: #1a1a2e;
            color: #fff;
            padding: 10px 12px;
            text-align: left;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 2;
            font-weight: 600;
            font-size: .78rem;
            letter-spacing: .3px;
        }
        thead th:hover { background: #16213e; }
        thead th .sort-arrow {
            display: inline-block;
            margin-left: 4px;
            font-size: .65rem;
            opacity: .5;
        }
        thead th.sorted-asc .sort-arrow::after { content: "\25B2"; opacity: 1; }
        thead th.sorted-desc .sort-arrow::after { content: "\25BC"; opacity: 1; }

        tbody tr { border-bottom: 1px solid #f0f0f0; }
        tbody tr:nth-child(even) { background: #fafbfc; }
        tbody tr:hover { background: #eef2ff; }

        td {
            padding: 8px 12px;
            white-space: nowrap;
        }

        /* Column type styling */
        td.col-team { font-weight: 600; }
        td.col-num  { text-align: right; font-variant-numeric: tabular-nums; }
        td.col-diff { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* Difference cell coloring */
        td.diff-pos { background: #fff0f0; color: #c0392b; }
        td.diff-neg { background: #f0fff4; color: #27ae60; }
        td.diff-zero { color: #888; }
        td.diff-na  { color: #ccc; font-style: italic; }

        /* Favored team column */
        td.col-favored { font-weight: 600; color: #2c3e50; }

        /* ------------------------------------------------------------------ */
        /* Loading / Error states                                             */
        /* ------------------------------------------------------------------ */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: #888;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            max-width: 600px;
            margin: 60px auto;
            padding: 24px 28px;
            background: #fff0f0;
            border: 1px solid #e74c3c;
            border-radius: 8px;
            color: #c0392b;
        }
        .error-box h3 { margin-bottom: 8px; }
        .error-box pre {
            margin-top: 12px;
            font-size: .78rem;
            white-space: pre-wrap;
            word-break: break-word;
            background: #fff;
            padding: 12px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ------------------------------------------------------------------ */
        /* Footer                                                             */
        /* ------------------------------------------------------------------ */
        .footer {
            text-align: center;
            padding: 16px;
            font-size: .75rem;
            color: #aaa;
        }

        /* ------------------------------------------------------------------ */
        /* Responsive                                                         */
        /* ------------------------------------------------------------------ */
        @media (max-width: 768px) {
            .header { padding: 14px 16px; }
            .header h1 { font-size: 1.1rem; }
            .stats-bar { padding: 8px 16px; gap: 12px; }
            .tab-bar { padding: 0 16px; }
            .tab-btn { padding: 10px 16px; font-size: .88rem; }
            .table-wrapper { padding: 12px 8px; }
            td, thead th { padding: 6px 8px; font-size: .75rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>CBB Market vs Model Comparison</h1>
        <div class="header-controls">
            <label class="auto-refresh-label">
                <input type="checkbox" id="autoRefreshToggle">
                Auto-refresh (5 min)
            </label>
            <button class="btn" id="refreshBtn" onclick="fetchData()">Refresh</button>
        </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar">
        <span class="stat-item">KenPom teams: <span class="stat-val" id="statKP">--</span></span>
        <span class="stat-item">Hasla matchups: <span class="stat-val" id="statHasla">--</span></span>
        <span class="stat-item">Barttorvik matchups: <span class="stat-val" id="statBart">--</span></span>
        <span class="stat-item">Market games: <span class="stat-val" id="statMarket">--</span></span>
        <span class="stat-item">Matched: <span class="stat-val" id="statTotal">--</span></span>
        <span class="updated-at" id="updatedAt"></span>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="totals" onclick="switchTab('totals')">Totals</button>
        <button class="tab-btn" data-tab="spreads" onclick="switchTab('spreads')">Spreads</button>
    </div>

    <!-- Loading state -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div>Loading data from Odds API and models...</div>
    </div>

    <!-- Error state -->
    <div id="errorContainer" style="display:none;"></div>

    <!-- Tables -->
    <div class="table-wrapper" id="totalsWrapper" hidden>
        <table id="totalsTable">
            <thead><tr id="totalsHead"></tr></thead>
            <tbody id="totalsBody"></tbody>
        </table>
    </div>
    <div class="table-wrapper" id="spreadsWrapper" hidden>
        <table id="spreadsTable">
            <thead><tr id="spreadsHead"></tr></thead>
            <tbody id="spreadsBody"></tbody>
        </table>
    </div>

    <div class="footer">
        Data: Odds API &middot; KenPom &middot; Haslametrics &middot; Barttorvik
    </div>

<script>
/* ====================================================================== */
/* State                                                                  */
/* ====================================================================== */
let rawData = null;
let currentTab = "totals";
let sortState = { totals: { col: null, asc: true }, spreads: { col: null, asc: true } };
let autoRefreshTimer = null;

/* ====================================================================== */
/* Column display names                                                   */
/* ====================================================================== */
const COL_LABELS = {
    Game_Date: "Date",
    Game_Time: "Time",
    TeamA: "Away",
    TeamB: "Home",
    ClosingTotal: "Market Total",
    KenPomTotal: "KenPom",
    HaslaTotal: "Hasla",
    BarttorvikTotal: "Barttorvik",
    MarketMinusKenPom: "Mkt\u2212KP",
    MarketMinusHasla: "Mkt\u2212Hasla",
    MarketMinusBarttorvik: "Mkt\u2212Bart",
    HaslaMinusKenPom: "Hasla\u2212KP",
    BooksWithTotal: "Books",
    ClosingSpread: "Market Spread",
    MarketFavoredTeam: "Favored",
    KenPomSpread: "KenPom",
    HaslaSpread: "Hasla",
    BarttorvikSpread: "Barttorvik",
    MarketMinusKenPomSpread: "Mkt\u2212KP",
    MarketMinusHaslaSpread: "Mkt\u2212Hasla",
    MarketMinusBarttorvikSpread: "Mkt\u2212Bart",
    HaslaMinusKenPomSpread: "Hasla\u2212KP",
    BooksWithSpread: "Books",
};

/* Columns that show difference values (color-coded) */
const DIFF_COLS = new Set([
    "MarketMinusKenPom", "MarketMinusHasla", "MarketMinusBarttorvik",
    "HaslaMinusKenPom",
    "MarketMinusKenPomSpread", "MarketMinusHaslaSpread",
    "MarketMinusBarttorvikSpread", "HaslaMinusKenPomSpread",
]);

/* Numeric columns (right-aligned) */
const NUM_COLS = new Set([
    "ClosingTotal", "KenPomTotal", "HaslaTotal", "BarttorvikTotal",
    "BooksWithTotal",
    "ClosingSpread", "KenPomSpread", "HaslaSpread", "BarttorvikSpread",
    "BooksWithSpread",
]);

const TEAM_COLS = new Set(["TeamA", "TeamB", "MarketFavoredTeam"]);

/* ====================================================================== */
/* Fetch data                                                             */
/* ====================================================================== */
async function fetchData() {
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    btn.textContent = "Loading\u2026";
    document.getElementById("loading").style.display = "flex";
    document.getElementById("errorContainer").style.display = "none";
    document.getElementById("totalsWrapper").hidden = true;
    document.getElementById("spreadsWrapper").hidden = true;

    try {
        const resp = await fetch("/api/data");
        const json = await resp.json();

        if (!json.success) {
            showError(json.error, json.traceback);
            return;
        }

        rawData = json;
        updateStats(json.stats, json.updated_at);
        renderTable("totals", json.totals.columns, json.totals.data);
        renderTable("spreads", json.spreads.columns, json.spreads.data);
        document.getElementById("loading").style.display = "none";
        switchTab(currentTab);
    } catch (err) {
        showError("Network error: " + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Refresh";
    }
}

/* ====================================================================== */
/* Render helpers                                                         */
/* ====================================================================== */
function updateStats(stats, updatedAt) {
    document.getElementById("statKP").textContent = stats.kenpom_teams;
    document.getElementById("statHasla").textContent = stats.hasla_matchups;
    document.getElementById("statBart").textContent = stats.barttorvik_matchups;
    document.getElementById("statMarket").textContent = stats.market_matchups;
    document.getElementById("statTotal").textContent = stats.total_games;
    document.getElementById("updatedAt").textContent = updatedAt ? ("Updated: " + updatedAt) : "";
}

function showError(msg, tb) {
    const el = document.getElementById("errorContainer");
    el.style.display = "block";
    document.getElementById("loading").style.display = "none";
    el.innerHTML = '<div class="error-box"><h3>Error</h3><p>' +
        escapeHtml(msg) + '</p>' +
        (tb ? '<pre>' + escapeHtml(tb) + '</pre>' : '') +
        '</div>';
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderTable(name, columns, data) {
    const headRow = document.getElementById(name + "Head");
    const tbody = document.getElementById(name + "Body");

    /* Header */
    headRow.innerHTML = "";
    columns.forEach((col, idx) => {
        const th = document.createElement("th");
        th.dataset.col = col;
        th.dataset.idx = idx;
        th.innerHTML = escapeHtml(COL_LABELS[col] || col) + ' <span class="sort-arrow"></span>';
        th.onclick = () => sortByColumn(name, col, idx);

        /* Restore sort indicator */
        const ss = sortState[name];
        if (ss.col === col) {
            th.classList.add(ss.asc ? "sorted-asc" : "sorted-desc");
        }
        headRow.appendChild(th);
    });

    /* Body */
    tbody.innerHTML = "";
    data.forEach(row => {
        const tr = document.createElement("tr");
        columns.forEach(col => {
            const td = document.createElement("td");
            const val = row[col];

            if (val === null || val === undefined || val === "") {
                td.textContent = "--";
                if (DIFF_COLS.has(col)) td.className = "col-diff diff-na";
                else if (NUM_COLS.has(col)) td.className = "col-num";
            } else if (DIFF_COLS.has(col)) {
                td.textContent = formatNum(val);
                td.className = "col-diff " + diffClass(val);
            } else if (NUM_COLS.has(col)) {
                td.textContent = formatNum(val);
                td.className = "col-num";
            } else if (TEAM_COLS.has(col)) {
                td.textContent = val;
                td.className = col === "MarketFavoredTeam" ? "col-favored" : "col-team";
            } else {
                td.textContent = val;
            }
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function formatNum(v) {
    if (typeof v !== "number") return v;
    return Number.isInteger(v) ? v.toString() : v.toFixed(2);
}

function diffClass(v) {
    if (v === null || v === undefined) return "diff-na";
    if (v > 0) return "diff-pos";
    if (v < 0) return "diff-neg";
    return "diff-zero";
}

/* ====================================================================== */
/* Sorting                                                                */
/* ====================================================================== */
function sortByColumn(tableName, col, colIdx) {
    if (!rawData) return;
    const ss = sortState[tableName];
    if (ss.col === col) {
        ss.asc = !ss.asc;
    } else {
        ss.col = col;
        ss.asc = true;
    }

    const tableData = tableName === "totals" ? rawData.totals : rawData.spreads;
    const data = [...tableData.data];

    data.sort((a, b) => {
        let va = a[col], vb = b[col];
        if (va === null || va === undefined) va = ss.asc ? Infinity : -Infinity;
        if (vb === null || vb === undefined) vb = ss.asc ? Infinity : -Infinity;
        if (typeof va === "string") return ss.asc ? va.localeCompare(vb) : vb.localeCompare(va);
        return ss.asc ? va - vb : vb - va;
    });

    renderTable(tableName, tableData.columns, data);

    /* Show sorted wrapper */
    if (tableName === currentTab) {
        document.getElementById(tableName + "Wrapper").hidden = false;
    }
}

/* ====================================================================== */
/* Tabs                                                                   */
/* ====================================================================== */
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
    });
    document.getElementById("totalsWrapper").hidden = (tab !== "totals");
    document.getElementById("spreadsWrapper").hidden = (tab !== "spreads");
}

/* ====================================================================== */
/* Auto-refresh                                                           */
/* ====================================================================== */
document.getElementById("autoRefreshToggle").addEventListener("change", function() {
    if (this.checked) {
        autoRefreshTimer = setInterval(fetchData, 5 * 60 * 1000);
    } else {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
    }
});

/* ====================================================================== */
/* Init                                                                   */
/* ====================================================================== */
fetchData();
</script>
</body>
</html>
